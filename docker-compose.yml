services:
  app:
    image: abitur-web:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://10.5.10.190:8000}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:-local-session-password-min-32-chars}
      NUXT_DATABASE_URL: ${NUXT_DATABASE_URL:-postgres://postgres:postgres@db:5432/abitur_web}
    ports:
      - "3000:3000"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:3000/login >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
