services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: abitur_web
      POSTGRES_USER: abitur
      POSTGRES_PASSWORD: abitur
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: abitur-web:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://10.5.10.190:8000}
    ports:
      - "3000:3000"
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:3000/login >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
