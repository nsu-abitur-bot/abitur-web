# Each worktree owns its node_modules and Nuxt outputs.
scripts:
  setup: |
    set -eu
    mise trust
    mise install
    if [ ! -e .env ] && [ -e "$ORCA_ROOT_PATH/.env" ]; then
      cp "$ORCA_ROOT_PATH/.env" .env
    fi
    mise exec -- bun install --frozen-lockfile
    mise exec -- task prepare
    mise exec -- task hooks

setupAgentStartupPolicy: wait-for-setup
worktree:
  sharedDirectories: []
