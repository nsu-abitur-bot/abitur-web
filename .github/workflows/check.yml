name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9465
      NUXT_SESSION_PASSWORD: isolated-ci-session-password-32-characters
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: task check
      - run: task types:verify
      - run: task build
      - run: bunx --no-install playwright install --with-deps chromium webkit
      - run: task e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: abitur-web:test
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Smoke test production container
        run: |
          node tests/e2e/fake-api.mjs > /tmp/fake-api.log 2>&1 &
          fake_api_pid=$!
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 --fail --silent --show-error --output /dev/null http://127.0.0.1:9465/health
          docker run -d --name abitur-smoke --network host \
            -e NITRO_PORT=9466 \
            -e NUXT_PUBLIC_API_BASE_URL=http://127.0.0.1:9465 \
            -e NUXT_SESSION_PASSWORD=isolated-docker-session-password-32-characters \
            -e NUXT_DATABASE_URL=postgres://test:test@127.0.0.1:5432/unused \
            abitur-web:test
          trap 'docker logs abitur-smoke; docker rm -f abitur-smoke; kill "$fake_api_pid"' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 --fail --silent --show-error --output /dev/null http://127.0.0.1:9466/login
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:9466/api/rating

  publish:
    needs: [check, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          push: true
          tags: ghcr.io/nsu-abitur-bot/abitur-web:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    concurrency:
      group: web-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Configure private SSH transport
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy immutable checked image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_IMAGE: ghcr.io/nsu-abitur-bot/abitur-web@${{ needs.publish.outputs.digest }}
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 deploy/ci/send_deploy.py
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
