name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_PUBLIC_API_BASE_URL: http://127.0.0.1:9465
      NUXT_SESSION_PASSWORD: isolated-ci-session-password-32-characters
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: task check
      - run: task types:verify
      - run: task build
      - run: bunx --no-install playwright install --with-deps chromium
      - run: task e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: abitur-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production container
        run: |
          node tests/e2e/fake-api.mjs > /tmp/fake-api.log 2>&1 &
          fake_api_pid=$!
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 --fail --silent --show-error --output /dev/null http://127.0.0.1:9465/health
          docker run -d --name abitur-smoke --network host \
            -e NITRO_PORT=9466 \
            -e NUXT_PUBLIC_API_BASE_URL=http://127.0.0.1:9465 \
            -e NUXT_SESSION_PASSWORD=isolated-docker-session-password-32-characters \
            -e NUXT_DATABASE_URL=postgres://test:test@127.0.0.1:5432/unused \
            abitur-web:test
          trap 'docker logs abitur-smoke; docker rm -f abitur-smoke; kill "$fake_api_pid"' EXIT
          curl --retry 20 --retry-all-errors --retry-delay 1 --max-time 3 --fail --silent --show-error --output /dev/null http://127.0.0.1:9466/login
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:9466/api/rating
